{
  "openapi": "3.1.0",
  "info": {
    "title": "OpenAPI definition",
    "version": "v0"
  },
  "servers": [
    {
      "url": "http://localhost:8080",
      "description": "Generated server url"
    }
  ],
  "tags": [
    {
      "name": "Document Management Service",
      "description": "API for managing PDF documents"
    }
  ],
  "paths": {
    "/api/v1/document-management/upload": {
      "post": {
        "tags": [
          "Document Management Service"
        ],
        "summary": "Upload a document",
        "description": "Uploads a PDF document with metadata and returns its unique ID.",
        "operationId": "upload",
        "requestBody": {
          "description": "Multipart request containing a PDF file (up to 500 MB) and its metadata in JSON\nformat.",
          "content": {
            "multipart/form-data": {
              "schema": {
                "$ref": "#/components/schemas/DocumentMetadata"
              }
            }
          },
          "required": true
        },
        "responses": {
          "201": {
            "description": "Document uploaded successfully",
            "content": {
              "*/*": {
                "schema": {
                  "$ref": "#/components/schemas/UploadDocumentResponse"
                },
                "example": {
                  "documentId": "a12b34cd-56ef-7890-ab12-cd34ef56ab78"
                }
              }
            }
          },
          "400": {
            "description": "Invalid metadata or file",
            "content": {
              "*/*": {
                "schema": {
                  "$ref": "#/components/schemas/UploadDocumentResponse"
                }
              }
            }
          },
          "409": {
            "description": "Duplicate document detected",
            "content": {
              "*/*": {
                "schema": {
                  "$ref": "#/components/schemas/UploadDocumentResponse"
                }
              }
            }
          },
          "500": {
            "description": "Internal server error",
            "content": {
              "*/*": {
                "schema": {
                  "$ref": "#/components/schemas/UploadDocumentResponse"
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/document-management/{id}/download": {
      "get": {
        "tags": [
          "Document Management Service"
        ],
        "summary": "Download a document",
        "description": "Downloads the document content by its unique ID.",
        "operationId": "download",
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "description": "Unique ID of the document",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid"
            },
            "example": "a12b34cd-56ef-7890-ab12-cd34ef56ab78"
          }
        ],
        "responses": {
          "200": {
            "description": "OK",
            "content": {
              "application/pdf": {}
            }
          },
          "404": {
            "description": "Document not found",
            "content": {
              "*/*": {
                "schema": {
                  "type": "string",
                  "format": "binary"
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/auth/token": {
      "get": {
        "tags": [
          "auth-controller"
        ],
        "operationId": "generateToken",
        "parameters": [
          {
            "name": "userId",
            "in": "query",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "OK",
            "content": {
              "*/*": {
                "schema": {
                  "$ref": "#/components/schemas/TokenResponse"
                }
              }
            }
          }
        }
      }
    }
  },
  "components": {
    "schemas": {
      "DocumentMetadata": {
        "type": "object",
        "properties": {
          "tags": {
            "type": "array",
            "items": {
              "type": "string"
            }
          },
          "userId": {
            "type": "string"
          }
        }
      },
      "UploadDocumentResponse": {
        "type": "object",
        "properties": {
          "documentId": {
            "type": "string",
            "format": "uuid"
          }
        }
      },
      "TokenResponse": {
        "type": "object",
        "properties": {
          "token": {
            "type": "string"
          },
          "type": {
            "type": "string"
          },
          "expiresIn": {
            "type": "integer",
            "format": "int64"
          }
        }
      }
    }
  }
}