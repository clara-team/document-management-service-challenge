#spring.profiles.active=local

# Server Configuration
server.servlet.contextPath=/
server.port=8080

# PostgreSQL DataBase Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/{POSTGRESQL_DATABASE}
spring.datasource.username={POSTGRESQL_USERNAME}
spring.datasource.password={POSTGRESQL_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Context path swagger-ui
springdoc.swagger-ui.path=/swagger-ui.html

# Minio Configuration
minio.endpoint=${MINIO_PORT_HOST}
minio.port-api=${MINIO_PORT_API}
minio.port-console=${MINIO_PORT_CONSOLE}
minio.root-user=${MINIO_ROOT_USER}
minio.root-password=${MINIO_ROOT_PASSWORD}
minio.access-key=${MINIO_ACCESS_KEY}
minio.secret-key=${MINIO_SECRET_KEY}
minio.secure=${MINIO_ROOT_PASSWORD}
minio.bucket-name=${MINIO_BUCKET_NAME}
minio.file-size=${MINIO_FILE_SIZE}
