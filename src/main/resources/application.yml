spring:
  application:
    name: document-management-service
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: document_schema
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false

  servlet:
    multipart:
      # Disabled — multipart is parsed manually using Commons FileUpload 2 streaming API,
      # which pipes bytes directly from the HTTP connection to MinIO without writing to disk.
      enabled: false

minio:
  endpoint: ${MINIO_ENDPOINT}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket: ${MINIO_BUCKET:document-bucket}
  presign-url-expiration: 15 # in minutes

server:
  port: 8080
  tomcat:
    # Allow all 10 concurrent upload requests to hold a connection while waiting for the semaphore.
    max-threads: 20
    accept-count: 10
    # 1 hour — with 10 uploads queued 2 at a time, the last request can wait up to
    # 4 full upload cycles before getting a slot. Time is not a constraint.
    connection-timeout: 3600000