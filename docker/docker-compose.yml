services:
  postgresql:
    container_name: postgresql_container
    image: docker.io/bitnamilegacy/postgresql:15
    ports:
      - "6432:5432"
    networks:
      - batch_network
    volumes:
      - challenge_postgresql_data:/bitnami/postgresql
      - ./init-scripts:/docker-entrypoint-initdb.d
    environment:
      - POSTGRESQL_USERNAME=${POSTGRESQL_USERNAME}
      - POSTGRESQL_PASSWORD=${POSTGRESQL_PASSWORD}
      - POSTGRESQL_DATABASE=${POSTGRESQL_DATABASE}
      - POSTGRESQL_POSTGRES_PASSWORD=${POSTGRESQL_PASSWORD}
    healthcheck:
      test:
        ["CMD", "pg_isready", "-U", "${POSTGRESQL_USERNAME}", "-d", "challenge"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    container_name: minio
    restart: always
    ports:
      - "9000:9000" # API S3
      - "9001:9001" # MinIO Web Console
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server --console-address ":9001" /data
    networks:
      - batch_network
    volumes:
      - challenge_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    networks:
      - batch_network
    depends_on:
      minio:
        condition: service_healthy
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - MINIO_SERVICE_ACCESS_KEY=${MINIO_SERVICE_ACCESS_KEY}
      - MINIO_SERVICE_SECRET_KEY=${MINIO_SERVICE_SECRET_KEY}
      - MINIO_BUCKET=${MINIO_BUCKET}
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
        mc mb --ignore-existing local/$$MINIO_BUCKET &&
        (mc admin user info local $$MINIO_SERVICE_ACCESS_KEY > /dev/null 2>&1 ||
         mc admin user add local $$MINIO_SERVICE_ACCESS_KEY $$MINIO_SERVICE_SECRET_KEY) &&
        mc admin policy attach local readwrite --user $$MINIO_SERVICE_ACCESS_KEY &&
        echo 'MinIO init completed.'
      "

  document-management-service:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: document-management-service
    depends_on:
      postgresql:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - batch_network
    ports:
      - "8080:8080"
    environment:
      - JAVA_OPTS=-Xmx50m -Xms50m
      - DB_URL=${DB_URL}
      - DB_USERNAME=${POSTGRESQL_USERNAME}
      - DB_PASSWORD=${POSTGRESQL_PASSWORD}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT}
      - MINIO_ACCESS_KEY=${MINIO_SERVICE_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SERVICE_SECRET_KEY}
      - MINIO_BUCKET=${MINIO_BUCKET}
    deploy:
      resources:
        limits:
          memory: 200M
    tmpfs:
      - /tmp:size=2g,mode=1777

volumes:
  challenge_postgresql_data:
    driver: local
  challenge_minio_data:
    driver: local

networks:
  batch_network:
    driver: bridge
